- id: tool-bash-persistent
  name: '@codem/tool-bash-persistent'
  inject: [shell]

- id: tool-subagent-control
  name: '@codem/subagent-control'
  inject: [subagent]

- id: tool-subagent-report
  name: '@codem/tool-subagent-report'
  inject: [subagent]

- id: atomic-write
  name: '@codem/atomic-write'
  inject: [fs]

# ===== 子 Agent =====
- id: subagent-fork-in-process
  name: '@codem/subagent-fork-in-process'
  inject: [subagent]

- id: subagent-spawn-in-process
  name: '@codem/subagent-spawn-in-process'
  inject: [subagent]

- id: subagent-in-process-driver
  name: '@codem/subagent-in-process-driver'
  inject: [subagent]

- id: subagent-acp
  name: '@codem/subagent-acp'
  inject: [subagent, acp]

- id: subagent-claude-code
  name: '@codem/subagent-claude-code'
  inject: [subagent, llm]

- id: subagent-codex
  name: '@codem/subagent-codex'
  inject: [subagent, llm]

- id: subagent-dsh-sdk
  name: '@codem/subagent-dsh-sdk'
  inject: [subagent, sdkProtocol]

# ===== E2B (可选，远程沙箱) =====
- id: e2b
  name: '@codem/e2b'
  disabled: true

- id: fs-e2b
  name: '@codem/fs-e2b'
  inject: [e2b]
  disabled: true

- id: subprocess-e2b
  name: '@codem/subprocess-e2b'
  inject: [e2b, subprocess]
  disabled: true

- id: subprocess-local
  name: '@codem/subprocess-local'
  inject: [subprocess]

# ===== 沙箱扩展 =====
- id: sandbox-windows-acl
  name: '@codem/sandbox-windows-acl'
  when: platform == 'win32'
  inject: [sandbox]

- id: fs-observation-policy
  name: '@codem/fs-observation-policy'

- id: fs-sandbox
  name: '@codem/fs-sandbox'
  inject: [fs, sandbox]

- id: tmux-context
  name: '@codem/tmux-context'
  when: platform != 'win32'
  inject: [shell]

# ===== 时间上下文 =====
- id: time-context
  name: '@codem/time-context'

# ===== Host/Client 架构 =====
- id: host-client
  name: '@codem/host-client'

- id: host-webserver
  name: '@codem/host-webserver'
