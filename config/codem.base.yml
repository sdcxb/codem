- id: remote-client
  name: '@codem/remote-client'
  inject: [sdkProtocol]

- id: cordis-client-runner
  name: '@codem/cordis-client-runner'
  inject: [sdkClient]

- id: cordis-host-runner
  name: '@codem/cordis-host-runner'
  inject: [host]

- id: cli
  name: '@codem/cli'
  inject: [session, tools, pluginRegistry]

# ===== Typert =====
- id: typert-registry
  name: '@codem/typert-registry'

- id: typert-loader
  name: '@codem/typert-loader'

- id: typert-generator
  name: '@codem/typert-generator'

- id: typert-protocol
  name: '@codem/typert-protocol'

# ===== 存储扩展 =====
- id: storage-domain
  name: '@codem/storage-domain'
  inject: [storage]

- id: storage-json
  name: '@codem/storage-json'
  inject: [storage]

