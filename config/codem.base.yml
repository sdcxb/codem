- id: notebook
  name: '@codem/notebook'

- id: squad
  name: '@codem/squad'

- id: squad-manager
  name: '@codem/squad-manager'

- id: dynamic-runner
  name: '@codem/dynamic-runner'

- id: plugin-registry
  name: '@codem/plugin-registry'

# ===== R1-R6 服务 =====
- id: event-log
  name: '@codem/event-log'

- id: telemetry
  name: '@codem/telemetry'

- id: file-change-tracker
  name: '@codem/file-change-tracker'

- id: transcript-cache
  name: '@codem/transcript-cache'

- id: i18n
  name: '@codem/i18n'

- id: cost-tracker
  name: '@codem/cost-tracker'
  inject: [llmEngine]

- id: model-profile
  name: '@codem/model-profile'
  inject: [llmEngine]

- id: tool-render
  name: '@codem/tool-render'
  inject: [llmEngine]

- id: recovery
  name: '@codem/recovery'
  inject: [llmEngine]

- id: retry
  name: '@codem/retry'
  inject: [llmEngine]

- id: issue
  name: '@codem/issue'

- id: inbox
  name: '@codem/inbox'

- id: schedule
  name: '@codem/schedule'
  inject: [inbox]

- id: preset
  name: '@codem/preset'

- id: vision-proxy
  name: '@codem/vision-proxy'

- id: spill
  name: '@codem/spill'

- id: spill-local
  name: '@codem/spill-local'
  inject: [spill]

- id: spill-policy
  name: '@codem/spill-policy'
  inject: [spill]
  config:
    maxInlineBytes: 50000

- id: persona
  name: '@codem/persona'

# ===== 工具插件 =====
- id: tool-jobs
  name: '@codem/tool-jobs'
  inject: [tools, automation]

- id: tool-fs-search
  name: '@codem/tool-fs-search'
  inject: [fs, tools]

- id: tool-str-replace-editor
  name: '@codem/tool-str-replace-editor'
  inject: [fs, tools]

- id: tool-ralph
  name: '@codem/tool-ralph'
