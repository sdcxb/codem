# Codem Base Bundle — 所有运行模式共享的核心插件清单
#
# 对标 DSH 的 cordis.patch.yml，声明式定义：
# - 插件 ID、名称、依赖关系
# - 平台条件禁用 (when: platform)
# - 插件配置 (config)
# - 核心/可选标记 (core: true)
#
# 加载器读取此文件后通过 builtin-registry 注册的映射表查找对应 Plugin 对象。

# ===== 核心服务（不可关闭） =====
# slots 服务在 App.tsx 中直接加载（SlotsService），不通过 builtinPlugins
# - id: slots
#   name: '@codem/slots'
#   core: true

- id: llm
  name: '@codem/llm'
  core: true
  inject: [llmEngine]
  config:
    defaultProvider: deepseek

- id: tools
  name: '@codem/tools'
  core: true
  inject: [llmEngine]

- id: session
  name: '@codem/session'
  core: true

- id: storage
  name: '@codem/storage'
  core: true

- id: store
  name: '@codem/store'
  core: true

- id: settings
  name: '@codem/settings'
  inject: [llmEngine]

- id: memory
  name: '@codem/memory'
  inject: [llmEngine]

- id: permission
  name: '@codem/permission'
  inject: [llmEngine]

- id: mcp
  name: '@codem/mcp'
  inject: [llmEngine]

- id: skill
  name: '@codem/skill'
  inject: [llmEngine]

- id: subagent
  name: '@codem/subagent'
  inject: [llmEngine]

- id: theme
  name: '@codem/theme'

- id: mimo-auth
  name: '@codem/mimo-auth'

# ===== 文件系统 / Shell =====
- id: fs-local
  name: '@codem/fs-local'
  core: true

- id: shell-local
  name: '@codem/shell-local'
  core: true

# 平台条件：PowerShell 仅 Windows
- id: pwsh-local
  name: '@codem/pwsh-local'
  when: platform == 'win32'
  inject: [shell]

# 平台条件：Bash 仅非 Windows
- id: bash-sandbox
  name: '@codem/bash-sandbox'
  when: platform != 'win32'
  inject: [shell, sandbox]

# 平台条件：pwsh-sandbox 仅 Windows
- id: pwsh-sandbox
  name: '@codem/pwsh-sandbox'
  when: platform == 'win32'
  inject: [shell, sandbox]

# ===== 沙箱 / 安全 =====
- id: sandbox-local
  name: '@codem/sandbox-local'

- id: sandbox-policy
  name: '@codem/sandbox-policy'
  inject: [sandbox]

- id: subprocess
  name: '@codem/subprocess'

- id: security-mode
  name: '@codem/security-mode'

- id: permissions
  name: '@codem/permissions'

# ===== Agent 引擎 =====
- id: agent-engine
  name: '@codem/agent-engine'
  core: true
  inject: [llmEngine]

- id: agent-registry
  name: '@codem/agent-registry'
  core: true
  inject: [llmEngine]

- id: streaming-executor
  name: '@codem/streaming-executor'
  core: true

- id: agent-loop
  name: '@codem/agent-loop'
  core: true
  inject: [llm, tools, agentEngine]

- id: agent
  name: '@codem/agent'
  core: true
  inject: [agentRegistry]

- id: agent-default-model
  name: '@codem/agent-default-model'
  inject: [modelProfile]

- id: agent-instructions
  name: '@codem/agent-instructions'

- id: agent-tool-presentation
  name: '@codem/agent-tool-presentation'
  inject: [toolRender]

- id: system-prompt
  name: '@codem/system-prompt'
  core: true
  inject: [agentInstructions]

- id: scope
  name: '@codem/scope'

# ===== 会话持久化 =====
- id: message-storage
  name: '@codem/message-storage'
  core: true

- id: session-persistence-sqlite
  name: '@codem/session-persistence-sqlite'
  inject: [session]

- id: session-persistence-jsonl
  name: '@codem/session-persistence-jsonl'
  inject: [session]

- id: session-projection
  name: '@codem/session-projection'
  inject: [session]

- id: session-projection-cache
  name: '@codem/session-projection-cache'
  inject: [sessionProjection]

- id: session-query-sqlite
  name: '@codem/session-query-sqlite'
  inject: [session]
  config:
    path: ':memory:'
    openAt: never

- id: session-stats
  name: '@codem/session-stats'
  inject: [session]

- id: session-title-llm
  name: '@codem/session-title-llm'
  inject: [llm, session]

- id: session-title-first-prompt-llm
  name: '@codem/session-title-first-prompt-llm'
  inject: [llm, session]

- id: session-title-all-prompts-llm
  name: '@codem/session-title-all-prompts-llm'
  inject: [llm, session]

- id: session-checkpoint
  name: '@codem/session-checkpoint'
  inject: [session]

- id: session-checkpoint-policy
  name: '@codem/session-checkpoint-policy'
  inject: [sessionCheckpoint]

- id: session-log-export
  name: '@codem/session-log-export'
  inject: [session]

- id: session-reference
  name: '@codem/session-reference'
  inject: [session]

- id: session-recovery
  name: '@codem/session-recovery'
  inject: [session]

- id: session-telemetry-otel
  name: '@codem/session-telemetry-otel'
  inject: [telemetry]
  config:
    mode: disabled

# ===== LLM 适配器 =====
- id: llm-retry
  name: '@codem/llm-retry'
  inject: [llm, llmEngine]

- id: token-meter
  name: '@codem/token-meter'

- id: llm-mimo
  name: '@codem/llm-mimo'
  inject: [llm]

- id: llm-openai
  name: '@codem/llm-openai'
  inject: [llm]

- id: llm-claude
  name: '@codem/llm-claude'
  inject: [llm]

- id: llm-gemini
  name: '@codem/llm-gemini'
  inject: [llm]

- id: llm-ollama
  name: '@codem/llm-ollama'
  inject: [llm]

- id: llm-deepseek
  name: '@codem/llm-deepseek'
  inject: [llm]

- id: llm-pi-ai
  name: '@codem/llm-pi-ai'
  inject: [llm]

# ===== Web / 搜索 =====
- id: web
  name: '@codem/web-search'

- id: web-fetch-http
  name: '@codem/web-fetch-http'
  inject: [web]

- id: web-search-mimo
  name: '@codem/web-search-mimo'
  inject: [web]

- id: web-search-exa
  name: '@codem/web-search-exa'
  inject: [web]

- id: web-search-perplexity
  name: '@codem/web-search-perplexity'
  inject: [web]

# ===== 上下文 / 压缩 =====
- id: compaction
  name: '@codem/compaction'

- id: compaction-basic
  name: '@codem/compaction-basic'
  inject: [compaction]

- id: compaction-tool-result-pruner
  name: '@codem/compaction-tool-result-pruner'
  inject: [compaction]
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: command-compact
  name: '@codem/command-compact'
  inject: [compaction, commands]

# ===== Guard / 保护 =====
- id: guard
  name: '@codem/guard'

- id: repeat-tool-reminder
  name: '@codem/repeat-tool-reminder'
  inject: [guard]
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500

- id: timeout-guard
  name: '@codem/timeout-guard'
  inject: [guard]

- id: invariants-guard
  name: '@codem/invariants-guard'
  inject: [guard]

- id: tool-call-timeout-policy
  name: '@codem/tool-call-timeout-policy'
  inject: [timeoutGuard]

# ===== 目标 / 计划 / 工作流 =====
- id: goal-round-driver
  name: '@codem/goal-round-driver'

- id: command-goal
  name: '@codem/command-goal'
  inject: [commands]

- id: plan-mode
  name: '@codem/plan-mode'
  inject: [plans]

- id: plans
  name: '@codem/plans'

# ===== 命令 / 技能 =====
- id: commands
  name: '@codem/commands'
  inject: [skill]

- id: command-feedback
  name: '@codem/command-feedback'

- id: skill-filesystem
  name: '@codem/skill-filesystem'
  inject: [skill, fs]

- id: skill-badge
  name: '@codem/skill-badge'
  inject: [skill]
  disabled: true

# ===== 用户交互 =====
- id: user-questions
  name: '@codem/user-questions'

- id: user-approval
  name: '@codem/user-approval'
  inject: [approval]

- id: approval
  name: '@codem/approval'

# ===== 凭证 / 附件 =====
- id: credentials
  name: '@codem/credentials'
  core: true

- id: attachments
  name: '@codem/attachments'

# ===== 其他服务 =====
- id: hooks
  name: '@codem/hooks'

- id: automation
  name: '@codem/automation'

- id: identity
  name: '@codem/identity'

- id: lsp
  name: '@codem/lsp'

- id: lsp-stdio
  name: '@codem/lsp-stdio'
  inject: [lsp]

- id: code-runtime
  name: '@codem/code-runtime'

- id: code-runtime-worker-thread
  name: '@codem/code-runtime-worker-thread'
