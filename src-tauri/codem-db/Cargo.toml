[package]
name = "codem-db"
version = "0.1.0"
edition = "2021"
description = "Codem 存储引擎（Rust 原生 SQLite）—— 渲染进程不再持有 WASM 数据库"
publish = false

[lib]
name = "codem_db"
path = "src/lib.rs"

[[bin]]
name = "codem-db-cli"
path = "src/bin/codem-db-cli.rs"

[dependencies]
# 原生 SQLite（bundled：把 SQLite 源码编进二进制，跨平台一致、可 pin 版本）
rusqlite = { version = "0.31", features = ["bundled", "hooks", "functions", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
