[package]
name = "codem"
version = "1.16.106"
description = "Codem - AI Coding Assistant"
authors = ["Codem"]
edition = "2021"

[lints.rust]
linker_messages = "allow"

[lib]
name = "codem_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
# 第 55 轮：库文件路径要与 Tauri 的 `app_data_dir()` **同源**。
#
# `dirs::data_dir()` 在 Windows 上走 `SHGetKnownFolderPath(FOLDERID_RoamingAppData)`
# （即 Tauri 用的那条规则），而**不是**读 `APPDATA` 环境变量 —— 环境变量缺失时两者会分叉：
# 渲染侧（走 Tauri）照常写真实数据目录、引擎（走环境变量）却把库建到别处
# （真机事故：库落进仓库工作目录，数据差点被提交）。同源之后这类分叉按构造不可能发生。
dirs = "6"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
hostname = "0.3"
window-vibrancy = "0.6"
rfd = "0.15"
open = "5"
base64 = "0.22"
x25519-dalek = "2"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
portable-pty = "0.8"
url = "2"
# 存储引擎（Rust 原生 SQLite）—— 渲染进程不再持有 WASM 数据库，见 docs/ARCH-SQLITE-TO-RUST.md
codem-db = { path = "codem-db" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dependencies.tokio-util]
version = "0.7"
features = ["io"]

