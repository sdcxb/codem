# codem.yml — Codem 插件清单
# 
# 声明所有内置插件包，PluginLoader 会读取此文件并按拓扑排序加载。
# 第三方插件可以通过在 node_modules/@codem/ 目录下放置 package.json 注册。

plugins:
  # ===== Core Providers =====
  - name: "@codem/llm"
    provides: ["llm"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/tools"
    provides: ["tools"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/session"
    provides: ["session"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/storage"
    provides: ["storage"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/memory"
    provides: ["memory"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/permission"
    provides: ["permission"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/mcp"
    provides: ["mcp"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/skill"
    provides: ["skill"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/subagent"
    provides: ["subagent"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/settings"
    provides: ["settings"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/theme"
    provides: ["theme"]
    inject: []
    priority: 0
    hot: true

  # ===== Capability Providers =====
  - name: "@codem/fs-local"
    provides: ["fs"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/shell-local"
    provides: ["shell"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/sandbox-local"
    provides: ["sandbox"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/web-search"
    provides: ["web"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/compaction"
    provides: ["compaction"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/hooks"
    provides: ["hooks"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/approval"
    provides: ["approval"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/permissions"
    provides: ["permissions"]
    inject: []
    priority: 0
    hot: true

  - name: "@codem/automation"
    provides: ["automation"]
    inject: []
    priority: 0
    hot: true

  # ===== P6 Providers =====
  - name: "@codem/identity"
    provides: ["identity"]
    inject: []
    priority: 0

  - name: "@codem/lsp"
    provides: ["lsp"]
    inject: []
    priority: 0

  - name: "@codem/code-runtime"
    provides: ["codeRuntime"]
    inject: []
    priority: 0

  - name: "@codem/workflow"
    provides: ["workflow"]
    inject: []
    priority: 0

  - name: "@codem/context-info"
    provides: ["contextInfo"]
    inject: []
    priority: 0

  - name: "@codem/commands"
    provides: ["commands"]
    inject: []
    priority: 0

  - name: "@codem/user-questions"
    provides: ["userQuestions"]
    inject: []
    priority: 0

  - name: "@codem/notebook"
    provides: ["notebook"]
    inject: []
    priority: 0

  - name: "@codem/squad"
    provides: ["squad"]
    inject: []
    priority: 0

  - name: "@codem/dynamic-runner"
    provides: ["dynamicCordisRunner"]
    inject: []
    priority: 0

  - name: "@codem/plugin-registry"
    provides: ["pluginRegistry"]
    inject: []
    priority: 0

  # ===== dsh Compat =====
  - name: "@codem/dsh-compat"
    provides: ["dshLlm", "dshShell", "dshFs", "dshTools", "dshSessions", "dshEvents", "dshCredentials"]
    inject: ["llm", "shell", "fs", "tools", "session"]
    priority: 0
    optional: true

  # ===== UI Plugins =====
  - name: "@codem/ui-sidebar"
    provides: []
    inject: ["slots"]
    slots: ["app.sidebar"]
    priority: 0

  - name: "@codem/ui-conversation"
    provides: []
    inject: ["slots"]
    slots: ["app.conversation", "conversation.messages", "conversation.input", "conversation.node.tool"]
    priority: 0

  - name: "@codem/ui-tool"
    provides: []
    inject: ["slots"]
    slots: ["conversation.details.tool"]
    priority: 0

  - name: "@codem/ui-settings"
    provides: []
    inject: ["slots"]
    slots: ["app.settings"]
    priority: 0

  - name: "@codem/ui-misc"
    provides: []
    inject: ["slots"]
    slots: ["app.overlay", "app.monitor", "app.goal"]
    priority: 0

  - name: "@codem/ui-market"
    provides: []
    inject: ["slots"]
    slots: ["app.skill-manager", "app.mcp-manager", "app.plugin-manager"]
    priority: 0

  - name: "@codem/ui-theme"
    provides: []
    inject: []
    priority: 0

  - name: "@codem/ui-skin"
    provides: []
    inject: ["slots"]
    slots: ["app.overlay"]
    priority: 0
