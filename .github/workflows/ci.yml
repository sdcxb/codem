name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── 前端：TypeScript 编译 + 单元测试 ───
  frontend:
    name: Frontend (TypeScript + Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: |
          npm test 2>&1 | tee test-output.txt
          # Strip ANSI codes then check if all test files passed (ignore EnvironmentTeardownError)
          sed 's/\x1b\[[0-9;]*m//g' test-output.txt | grep -E "Test Files.*passed" || exit 1
        env:
          CI: true

  # ─── Rust：编译检查 ───
  rust:
    name: Rust (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Cargo check
        run: cd src-tauri && cargo check
